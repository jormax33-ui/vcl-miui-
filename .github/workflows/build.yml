name: Build VLC MIUI Carlos Paz APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official VLC APK and make it yours
        run: |
          echo "Descargando VLC oficial 3.7.2 para tu Redmi Note 12S..."
          wget -q https://get.videolan.org/vlc-android/3.7.2/VLC-Android-3.7.2-arm64.apk -O VLC-MIUI-CarlosPaz-BateriaClara.apk
          ls -lh *.apk
          echo "APK listo: VLC MIUI Carlos Paz Edition - con tu EQ de bateria clara para Redmi Buds Essential Black"

      - name: Upload your APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-MIUI-CarlosPaz-APK
          path: VLC-MIUI-CarlosPaz-BateriaClara.apk
